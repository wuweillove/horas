<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content" />
    <meta name="theme-color" content="#3e4a46" />
    <meta name="color-scheme" content="light dark" />
    <script>
      (function () {
        var hour = new Date().getHours();
        if (hour >= 19 || hour < 7) {
          document.documentElement.dataset.night = "1";
          var meta = document.querySelector('meta[name="theme-color"]');
          if (meta) meta.setAttribute("content", "#161c1b");
        }
      })();
    </script>
    <meta name="description" content="Horas is a freelancer time desk. Clock in, take breaks, and invoice the hours." />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Horas" />
    <meta name="format-detection" content="telephone=no" />
    <title>Horas</title>
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" href="./icon-192.png" sizes="192x192" />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%233e4a46'/%3E%3Crect x='7' y='6' width='18' height='20' fill='%23e8ebe4'/%3E%3Crect x='10' y='13' width='12' height='3' fill='%2325408f'/%3E%3C/svg%3E"
    />
    <link rel="apple-touch-icon" href="./icon-180.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Commissioner:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
